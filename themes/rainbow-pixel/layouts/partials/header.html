<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} 首页">
      {{ with resources.Get "head.png" }}
        {{ $logo := .Resize "68x68 webp" }}
        <img class="brand-mark" src="{{ $logo.RelPermalink }}" alt="{{ site.Title }}" width="34" height="34">
      {{ end }}
      <span class="brand-text">{{ site.Title }}</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      {{ range site.Menus.main }}
      <a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }} aria-current="page" {{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
